<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-labelledby="title desc">
  <title id="title">Aplicativos para fins Eclesiásticos</title>
  <desc id="desc">Ilustração animada de software de controle eclesiástico para gestão de membros, agenda, eventos e comunicação.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064b3b"/>
      <stop offset="100%" stop-color="#0a7a52"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123f38"/>
      <stop offset="100%" stop-color="#0d302c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#001d17" flood-opacity=".35"/>
    </filter>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float2 { animation: float 4.7s ease-in-out .5s infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      .dash { stroke-dasharray: 8 5; animation: moveDash 2.5s linear infinite; }
      .rise { animation: rise 2.3s ease-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes blink { 0%,84%,100% { opacity: 1; } 90% { opacity: .3; } }
      @keyframes moveDash { to { stroke-dashoffset: -26; } }
      @keyframes rise { from { transform: scaleY(.78); } to { transform: scaleY(1); } }
    </style>
  </defs>

  <!-- Fundo verde, sem cantos arredondados -->
  <rect width="500" height="300" fill="url(#bg)"/>
  <path d="M0 238 L500 175 V300 H0Z" fill="#053b31" opacity=".38"/>
  <path d="M0 44 L500 0 V22 L0 65Z" fill="#64d5a2" opacity=".08"/>

  <!-- Título e símbolo eclesiástico -->
  <g class="ui" fill="#fff">
    <text x="32" y="55" font-size="23" font-weight="700" letter-spacing=".15">Aplicativos para fins</text>
    <text x="32" y="81" font-size="26" font-weight="700" letter-spacing=".15">Eclesiásticos</text>
    <text x="468" y="59" text-anchor="end" font-size="12" font-weight="700" fill="#b7f4d0" letter-spacing="1.5">GESTÃO</text>
    <text x="468" y="76" text-anchor="end" font-size="12" font-weight="700" fill="#b7f4d0" letter-spacing="1.5">INTEGRADA</text>
  </g>
  <g class="float" filter="url(#shadow)">
    <circle cx="345" cy="57" r="25" fill="#0d5d46" stroke="#72e6ad" stroke-width="2"/>
    <path d="M345 39 V74 M333 50 H357" stroke="#d8ffe6" stroke-width="5" stroke-linecap="square"/>
    <circle cx="345" cy="57" r="19" fill="none" stroke="#78ddb0" stroke-width="1" opacity=".7"/>
  </g>

  <!-- Painel de membros -->
  <g filter="url(#shadow)">
    <rect x="30" y="106" width="142" height="137" fill="url(#panel)" stroke="#43bd86" stroke-opacity=".35"/>
    <rect x="30" y="106" width="142" height="7" fill="#54d49a"/>
    <g class="ui">
      <text x="46" y="132" font-size="10" fill="#9bdabd" letter-spacing="1.1">MEMBROS ATIVOS</text>
      <text x="46" y="171" font-size="32" font-weight="700" fill="#fff">1.248</text>
      <text x="47" y="191" font-size="10" fill="#8ed6b3">pessoas cadastradas</text>
      <g class="pulse">
        <circle cx="139" cy="151" r="17" fill="#0a7652" stroke="#68e4aa" stroke-width="1.5"/>
        <circle cx="139" cy="147" r="5" fill="#d8ffe7"/>
        <path d="M129 162 Q139 151 149 162" fill="none" stroke="#d8ffe7" stroke-width="3"/>
      </g>
      <path d="M47 218 H154" stroke="#315b50" stroke-width="1"/>
      <circle cx="53" cy="218" r="3" fill="#6ce8aa"/>
      <text x="63" y="222" font-size="10" fill="#8ed6b3">+8,4% este mês</text>
    </g>
  </g>

  <!-- Calendário e agenda de eventos -->
  <g filter="url(#shadow)">
    <rect x="187" y="106" width="145" height="137" fill="url(#panel)" stroke="#43bd86" stroke-opacity=".35"/>
    <g class="ui">
      <text x="203" y="132" font-size="10" fill="#9bdabd" letter-spacing="1.1">AGENDA DE EVENTOS</text>
      <rect x="204" y="145" width="108" height="68" fill="#164a3c" stroke="#5bc896" stroke-width="1"/>
      <rect x="204" y="145" width="108" height="16" fill="#2d8562"/>
      <text x="258" y="157" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">OUTUBRO 2026</text>
      <g fill="#9bdabd" font-size="8" text-anchor="middle">
        <text x="218" y="174">S</text><text x="236" y="174">T</text><text x="254" y="174">Q</text><text x="272" y="174">Q</text><text x="290" y="174">S</text><text x="307" y="174">S</text>
        <text x="218" y="190">5</text><text x="236" y="190">6</text><text x="254" y="190">7</text><text x="272" y="190">8</text><text x="290" y="190">9</text><text x="307" y="190">10</text>
        <text x="218" y="205">12</text><text x="236" y="205">13</text><text x="254" y="205">14</text><text x="272" y="205">15</text><text x="290" y="205">16</text><text x="307" y="205">17</text>
      </g>
      <circle cx="272" cy="187" r="9" fill="none" stroke="#e4c45e" stroke-width="2" class="blink"/>
      <text x="204" y="229" font-size="9" fill="#8ed6b3">3 compromissos hoje</text>
    </g>
  </g>

  <!-- Comunicação e contribuições -->
  <g filter="url(#shadow)">
    <rect x="347" y="106" width="123" height="137" fill="url(#panel)" stroke="#43bd86" stroke-opacity=".35"/>
    <g class="ui">
      <text x="363" y="132" font-size="10" fill="#9bdabd" letter-spacing="1">CONTROLE</text>
      <g class="rise">
        <rect x="365" y="190" width="12" height="26" fill="#67e5aa"/>
        <rect x="383" y="178" width="12" height="38" fill="#55ca93"/>
        <rect x="401" y="166" width="12" height="50" fill="#e2bd50"/>
        <rect x="419" y="185" width="12" height="31" fill="#66cde0"/>
      </g>
      <path d="M360 217 H447" stroke="#315b50" stroke-width="1"/>
      <text x="363" y="153" font-size="10" fill="#b5e9cd">Contribuições</text>
      <text x="363" y="169" font-size="17" font-weight="700" fill="#fff">R$ 32.580</text>
      <circle cx="365" cy="229" r="3" fill="#6ce8aa" class="blink"/>
      <text x="375" y="233" font-size="9" fill="#8ed6b3">controle atualizado</text>
    </g>
  </g>

  <!-- Faixa inferior: comunicação e ministérios -->
  <g class="ui">
    <rect x="30" y="260" width="440" height="1" fill="#72d8a8" opacity=".35"/>
    <text x="47" y="281" font-size="10" fill="#b5e9cd">COMUNIDADE CONECTADA</text>
    <g transform="translate(190 270)" class="float2">
      <path d="M0 4 H25 V17 H0Z M5 17 V21 H20 V17 M5 8 H20" fill="none" stroke="#8eeabc" stroke-width="2"/>
      <text x="36" y="14" font-size="10" fill="#b5e9cd">Ministérios</text>
    </g>
    <g transform="translate(315 270)">
      <path d="M0 8 Q10 -2 20 8 L20 17 H0Z" fill="none" stroke="#8eeabc" stroke-width="2"/>
      <path d="M10 3 V17 M5 8 H15" stroke="#8eeabc" stroke-width="1.5"/>
      <text x="30" y="14" font-size="10" fill="#b5e9cd">Avisos</text>
    </g>
  </g>
</svg>
