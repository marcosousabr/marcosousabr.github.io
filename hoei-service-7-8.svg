<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-labelledby="title desc">
  <title id="title">HOEI Service 7.8</title>
  <desc id="desc">Ilustração animada de software de controle e planejamento da manutenção industrial.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064b3b"/>
      <stop offset="100%" stop-color="#0a7a52"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123f38"/>
      <stop offset="100%" stop-color="#0d302c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#001d17" flood-opacity=".35"/>
    </filter>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; }
      .gear { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
      .gearReverse { animation: spinReverse 10s linear infinite; transform-box: fill-box; transform-origin: center; }
      .float { animation: float 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      .progress { animation: progress 2.6s ease-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinReverse { to { transform: rotate(-360deg); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .88; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes blink { 0%,82%,100% { opacity: 1; } 88% { opacity: .28; } }
      @keyframes progress { from { width: 35px; } to { width: 72px; } }
    </style>
  </defs>

  <!-- Fundo verde, sem bordas arredondadas -->
  <rect width="500" height="300" fill="url(#bg)"/>
  <path d="M0 238 L500 175 V300 H0Z" fill="#053b31" opacity=".38"/>
  <path d="M0 44 L500 0 V22 L0 65Z" fill="#64d5a2" opacity=".08"/>

  <!-- Identidade do sistema -->
  <g class="ui" fill="#fff">
    <text x="32" y="58" font-size="28" font-weight="700" letter-spacing=".4">HOEI Service</text>
    <text x="33" y="82" font-size="14" font-weight="700" fill="#a8f0cc" letter-spacing="2.4">CONTROLE E PLANEJAMENTO</text>
    <text x="468" y="61" text-anchor="end" font-size="25" font-weight="700" fill="#b7f4d0">7.8</text>
  </g>

  <!-- Ícone de engrenagens -->
  <g class="float" filter="url(#shadow)">
    <g transform="translate(414 61)">
      <g class="gear">
        <path d="M0-25 L6-23 9-16 17-18 23-12 19-5 25 0 23 6 16 9 18 17 12 23 5 19 0 25-6 23-9 16-17 18-23 12-19 5-25 0-23-6-16-9-18-17-12-23-5-19Z" fill="#d7b03b" stroke="#ffe28a" stroke-width="1.5"/>
        <circle r="11" fill="#0d5040" stroke="#fff0a5" stroke-width="2"/>
        <circle r="4" fill="#d7b03b"/>
      </g>
      <g class="gearReverse" transform="translate(31 21) scale(.62)">
        <path d="M0-25 L6-23 9-16 17-18 23-12 19-5 25 0 23 6 16 9 18 17 12 23 5 19 0 25-6 23-9 16-17 18-23 12-19 5-25 0-23-6-16-9-18-17-12-23-5-19Z" fill="#68d99f" stroke="#b7f4d0" stroke-width="1.5"/>
        <circle r="11" fill="#0d5040" stroke="#d0f8dd" stroke-width="2"/>
        <circle r="4" fill="#68d99f"/>
      </g>
    </g>
  </g>

  <!-- Painel de ordens de serviço -->
  <g filter="url(#shadow)">
    <rect x="30" y="105" width="215" height="137" fill="url(#panel)" stroke="#43bd86" stroke-opacity=".35"/>
    <rect x="30" y="105" width="215" height="7" fill="#54d49a"/>
    <g class="ui">
      <text x="48" y="132" font-size="11" fill="#9bdabd" letter-spacing="1.3">ORDENS DE SERVIÇO</text>
      <text x="48" y="174" font-size="37" font-weight="700" fill="#fff">128</text>
      <text x="49" y="193" font-size="11" fill="#8ed6b3">programadas para hoje</text>
      <g class="pulse">
        <circle cx="205" cy="151" r="22" fill="#0b7652" stroke="#68e4aa" stroke-width="1.5"/>
        <path d="M194 151 h22 M205 140 v22" stroke="#d8ffe7" stroke-width="3"/>
        <path d="M199 143 l12 16 M211 143 l-12 16" stroke="#0b7652" stroke-width="2"/>
      </g>
      <path d="M49 218 H226" stroke="#315b50" stroke-width="1"/>
      <circle cx="55" cy="218" r="3" fill="#6ce8aa"/>
      <text x="65" y="222" font-size="10" fill="#8ed6b3">32 concluídas</text>
      <circle cx="145" cy="218" r="3" fill="#e6c55d"/>
      <text x="155" y="222" font-size="10" fill="#8ed6b3">9 críticas</text>
    </g>
  </g>

  <!-- Painel de planejamento -->
  <g filter="url(#shadow)">
    <rect x="265" y="105" width="205" height="137" fill="url(#panel)" stroke="#43bd86" stroke-opacity=".35"/>
    <g class="ui">
      <text x="282" y="130" font-size="11" fill="#9bdabd" letter-spacing="1.2">PLANO DE MANUTENÇÃO</text>
      <text x="282" y="153" font-size="10" fill="#77b79c">Eficiência operacional</text>
      <rect x="282" y="161" width="137" height="8" fill="#224b40"/>
      <rect x="282" y="161" width="92" height="8" fill="#67e5aa" class="progress"/>
      <text x="428" y="169" text-anchor="end" font-size="11" font-weight="700" fill="#d6ffe4">68%</text>
      <path d="M282 190 H452 M282 214 H452" stroke="#315b50" stroke-width="1"/>
      <g class="blink">
        <circle cx="291" cy="190" r="5" fill="#6ce8aa"/>
        <text x="305" y="194" font-size="10" fill="#b5e9cd">Preventiva em dia</text>
      </g>
      <circle cx="291" cy="214" r="5" fill="#f0cb62"/>
      <text x="305" y="218" font-size="10" fill="#b5e9cd">Inspeção agendada</text>
    </g>
  </g>

  <!-- Linha do tempo industrial -->
  <g class="ui">
    <rect x="30" y="260" width="440" height="1" fill="#72d8a8" opacity=".35"/>
    <text x="47" y="280" font-size="10" fill="#b5e9cd">LINHA DO TEMPO</text>
    <path d="M136 276 H448" stroke="#4e9d7c" stroke-width="2"/>
    <g class="float">
      <circle cx="168" cy="276" r="5" fill="#6ce8aa" stroke="#d5ffe5" stroke-width="1"/>
      <text x="158" y="294" font-size="9" fill="#8ed6b3">08:00</text>
    </g>
    <circle cx="265" cy="276" r="5" fill="#e5c55c"/>
    <text x="255" y="294" font-size="9" fill="#8ed6b3">10:30</text>
    <circle cx="362" cy="276" r="5" fill="#65c8e2"/>
    <text x="352" y="294" font-size="9" fill="#8ed6b3">14:00</text>
    <circle cx="448" cy="276" r="5" fill="#4e9d7c" stroke="#8ed6b3" stroke-width="1"/>
    <text x="438" y="294" font-size="9" fill="#8ed6b3">18:00</text>
  </g>
</svg>
