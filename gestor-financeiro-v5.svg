<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-labelledby="title desc">
  <title id="title">Gestor Financeiro V.5</title>
  <desc id="desc">Ilustração animada de um software de gestão financeira em tons de verde, com painel, gráfico, moedas e indicadores.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064b3b"/>
      <stop offset="100%" stop-color="#0a7a52"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123f38"/>
      <stop offset="100%" stop-color="#0d302c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#001d17" flood-opacity=".35"/>
    </filter>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; }
      .float { animation: float 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float2 { animation: float 4.6s ease-in-out 0.6s infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .draw { stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 2.5s ease-out .7s forwards; }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%,85%,100% { opacity: 1; } 90% { opacity: .35; } }
    </style>
  </defs>

  <!-- Fundo verde com cantos quadrados -->
  <rect width="500" height="300" fill="url(#bg)"/>
  <path d="M0 238 L500 175 V300 H0Z" fill="#053b31" opacity=".38"/>
  <path d="M0 44 L500 0 V22 L0 65Z" fill="#64d5a2" opacity=".08"/>

  <!-- Título -->
  <g class="ui" fill="#fff">
    <text x="32" y="58" font-size="27" font-weight="700" letter-spacing=".2">Gestor Financeiro</text>
    <text x="33" y="82" font-size="14" font-weight="700" fill="#a8f0cc" letter-spacing="3">PLATAFORMA DE CONTROLE</text>
    <text x="468" y="61" text-anchor="end" font-size="25" font-weight="700" fill="#b7f4d0">V.5</text>
  </g>

  <!-- Cartão principal -->
  <g filter="url(#shadow)">
    <rect x="30" y="105" width="235" height="137" fill="url(#panel)" stroke="#43bd86" stroke-opacity=".35"/>
    <rect x="30" y="105" width="235" height="7" fill="#54d49a"/>
    <g class="ui">
      <text x="49" y="133" font-size="11" fill="#9bdabd" letter-spacing="1.5">SALDO CONSOLIDADO</text>
      <text x="49" y="164" font-size="27" font-weight="700" fill="#fff">R$ 84.750,30</text>
      <g class="pulse">
        <circle cx="231" cy="136" r="15" fill="#0a7c55" stroke="#65e1a6" stroke-width="1.5"/>
        <path d="M224 137 l5 5 9-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="square"/>
      </g>
      <text x="49" y="189" font-size="11" fill="#8ed6b3">+12,8% no último mês</text>
      <path d="M49 218 H245" stroke="#356659" stroke-width="1"/>
      <circle cx="55" cy="218" r="3" fill="#67e5aa"/>
      <text x="65" y="222" font-size="10" fill="#8ed6b3">Fluxo positivo</text>
    </g>
  </g>

  <!-- Gráfico de linhas -->
  <g filter="url(#shadow)">
    <rect x="285" y="105" width="185" height="137" fill="url(#panel)" stroke="#43bd86" stroke-opacity=".35"/>
    <g class="ui">
      <text x="301" y="130" font-size="11" fill="#9bdabd" letter-spacing="1.2">RECEITAS X DESPESAS</text>
      <path d="M301 215 H451 M301 190 H451 M301 165 H451" stroke="#315b50" stroke-width="1"/>
      <path d="M301 207 C321 198 327 205 343 184 S367 190 380 173 S402 181 414 153 S435 161 451 139" fill="none" stroke="#6ce8aa" stroke-width="3" stroke-linecap="square" class="draw"/>
      <path d="M301 184 C320 178 328 190 344 190 S367 198 381 187 S403 194 416 182 S438 188 451 176" fill="none" stroke="#f4cf75" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="451" cy="139" r="4" fill="#fff" class="blink"/>
      <circle cx="451" cy="176" r="3" fill="#f4cf75"/>
      <text x="301" y="230" font-size="9" fill="#77b79c">JAN</text>
      <text x="367" y="230" font-size="9" fill="#77b79c">JUN</text>
      <text x="433" y="230" font-size="9" fill="#77b79c">DEZ</text>
    </g>
  </g>

  <!-- Moedas flutuantes -->
  <g class="float" filter="url(#shadow)">
    <circle cx="408" cy="65" r="25" fill="#e8b83e" stroke="#ffe18a" stroke-width="2"/>
    <circle cx="408" cy="65" r="18" fill="none" stroke="#b98218" stroke-width="1.5"/>
    <text x="408" y="74" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#fff4b8">$</text>
  </g>
  <g class="float2" filter="url(#shadow)">
    <circle cx="463" cy="87" r="14" fill="#e8b83e" stroke="#ffe18a" stroke-width="1.5"/>
    <text x="463" y="94" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff4b8">$</text>
  </g>

  <!-- Barra inferior com módulos -->
  <g class="ui">
    <rect x="30" y="260" width="440" height="1" fill="#72d8a8" opacity=".35"/>
    <g class="float2">
      <rect x="47" y="273" width="7" height="13" fill="#7ae7b4"/>
      <rect x="57" y="269" width="7" height="17" fill="#55cc93"/>
      <rect x="67" y="265" width="7" height="21" fill="#d8b13c"/>
      <text x="84" y="281" font-size="11" fill="#b5e9cd">Relatórios inteligentes</text>
    </g>
    <g transform="translate(253 271)">
      <path d="M0 11 H18 M9 2 V20" stroke="#8eeabc" stroke-width="2"/>
      <text x="28" y="15" font-size="11" fill="#b5e9cd">Automação</text>
    </g>
    <g transform="translate(382 271)">
      <circle cx="8" cy="11" r="8" fill="none" stroke="#8eeabc" stroke-width="2"/>
      <path d="M8 6 V12 L12 14" stroke="#8eeabc" stroke-width="2" fill="none"/>
      <text x="24" y="15" font-size="11" fill="#b5e9cd">Tempo real</text>
    </g>
  </g>
</svg>
